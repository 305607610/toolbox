[package]
name = "toolbox"
version = "0.1.0"
description = "叮当，一个 Windows 桌面工具合集"
authors = ["toolbox"]
edition = "2024"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
pdfium-render = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
lopdf = "0.47.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
